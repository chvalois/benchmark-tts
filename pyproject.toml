[project]
name = "benchmark-tts"
version = "0.0.0"
description = "Benchmark reproductible de modèles TTS open source, spécialisé français"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["benchmark/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["benchmark"]
# CLI/runners qui chargent un modèle ou font de l'I/O réseau — vérifiés en
# run réel ; leurs helpers PURS restent couverts (test_transcrire.py, etc.) :
omit = [
  "benchmark/tests/*",
  "benchmark/fetch_models.py",
  "benchmark/transcrire.py",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "raise SystemExit"]

[tool.ruff]
line-length = 100
target-version = "py310"
