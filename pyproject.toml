[project]
name = "benchmark-tts"
version = "0.0.0"
description = "Benchmark reproductible de modèles TTS open source, spécialisé français"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["benchmark/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["benchmark"]
# CLI d'I/O (téléchargement HF), vérifiée manuellement via `--check` :
omit = ["benchmark/tests/*", "benchmark/fetch_models.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
