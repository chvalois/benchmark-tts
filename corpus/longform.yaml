lf10:
  titre: "Reportage — feature, planté de décor, citation, analyse"
  genre: journalisme_reportage
  duree_cible_s: 108
  fictif: true
  traits: [tenue_timbre, discours_rapporte, incise, nombre_complexe, nom_propre_dense, bascule_registre]
  texte: |
    Il est sept heures du matin, et sur la place de Grismouton, la buée sort des bouches autant que des tasses. Ils sont une trentaine, ce samedi-là, à s'être levés avant le jour pour une raison qui, vue de l'extérieur, peut sembler dérisoire : sauver une ligne de bus.

    La ligne 7 relie le village au chef-lieu, vingt-deux kilomètres plus au sud. Quatre allers-retours par jour, une quarantaine d'usagers réguliers, en majorité des lycéens et des personnes âgées. Le conseil régional envisage de la supprimer à la rentrée, jugeant son coût, un peu plus de deux cent mille euros par an, disproportionné.

    « Ce n'est pas une ligne de bus qu'ils veulent fermer, c'est une porte », résume Mathis Renard, dix-sept ans, qui met aujourd'hui une heure quarante pour rejoindre son lycée, contre trente-cinq minutes avec le bus. À côté de lui, madame Ferrand, quatre-vingt-un ans, n'a pas d'autre moyen d'aller chez le médecin.

    Le débat dépasse largement Grismouton. Dans la région, cent quatre-vingts lignes de ce type sont aujourd'hui « à l'étude », un euphémisme administratif que tout le monde, ici, a appris à traduire. Derrière les chiffres, une question politique simple : jusqu'où finance-t-on un service public qui ne sera jamais rentable ?

    À neuf heures, la pétition avait recueilli six cent quarante signatures. Le car de neuf heures dix, lui, est parti à l'heure, avec trois passagers à bord.

# ---------------------------------------------------------------------
lf11:
  titre: "Édito — chronique d'opinion, première personne, ironie"
  genre: edito
  duree_cible_s: 72
  fictif: true
  traits: [ironie, question_rhetorique, incise, bascule_registre, anglicisme]
  texte: |
    On nous avait promis que tout irait plus vite. C'était même l'argument principal. Grâce aux nouveaux outils, disait la brochure, nous allions « gagner un temps considérable ». Six mois plus tard, je passe mes journées à relire ce que des machines ont écrit à ma place, et mes soirées à réécrire ce que j'avais relu trop vite. Le progrès a ceci de merveilleux qu'il trouve toujours le moyen de vous rendre indispensable à la correction de ses propres erreurs.

    Comprenons-nous bien : je ne suis pas nostalgique. Je n'ai aucune envie de revenir au fax, ni au carbone, ni aux réunions de trois heures pour décider de la date de la prochaine réunion. La question n'est pas de savoir si ces outils sont utiles. Ils le sont. La question, la seule, c'est : utiles à qui, et pour faire quoi ?

    Parce qu'un gain de temps qui ne profite qu'à celui qui vous facture ce temps, dans mon dictionnaire, ça porte un autre nom.

# ---------------------------------------------------------------------
lf12:
  titre: "Desk éco — normalisation hostile : sigles, taux, indices, dates"
  genre: journalisme_flash
  duree_cible_s: 92
  fictif: true
  traits: [sigle, nombre_complexe, date_heure, nom_propre_dense, terminologie, enumeration]
  texte: |
    Les marchés d'abord. À la clôture, ce jeudi, le CAC 40 a cédé un virgule sept pour cent, à sept mille huit cent quarante-deux points, plombé par le secteur du luxe. À Francfort, le DAX perd zéro virgule neuf pour cent ; à New York, le Dow Jones était quasiment stable à l'ouverture, vers quinze heures trente, heure de Paris.

    Sur le front des taux, la BCE a maintenu son taux de dépôt à trois virgule vingt-cinq pour cent, une décision attendue par la quasi-totalité des analystes. La prochaine réunion est fixée au 7 septembre.

    Côté conjoncture, l'INSEE a révisé sa prévision de croissance pour deux mille vingt-cinq, de plus zéro virgule huit à plus un virgule un pour cent, et anticipe une inflation entre un virgule six et un virgule neuf pour cent sur l'ensemble de l'année.

    Enfin, le groupe agroalimentaire Vaugirand, numéro quatre mondial du secteur, annonce la suppression de trois cents à quatre cent cinquante postes, soit près de douze pour cent de ses effectifs européens.
