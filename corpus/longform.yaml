lf05:
  titre: "Podcast solo — ouverture d'épisode, adresse directe"
  genre: podcast_solo
  duree_cible_s: 82
  fictif: true
  traits: [anglicisme, question_rhetorique, disfluence, incise, bascule_registre, enumeration]
  texte: |
    Salut à toutes et à tous, et bienvenue dans le quarante-deuxième épisode de « Signal faible », le podcast qui prend le temps de regarder ce que tout le monde regarde trop vite. Je suis ravi de vous retrouver.

    Avant de commencer, deux choses rapides. La première : merci, vraiment, pour tous vos retours sur l'épisode précédent. On a reçu, euh, je crois, plus de trois cents messages, et j'en ai lu chacun. La seconde : si l'émission vous plaît, le meilleur moyen de nous aider, c'est encore d'en parler autour de vous, à une personne, une seule, qui pourrait avoir envie de l'écouter.

    Bon. Le sujet du jour, c'est l'attention. Pas la vôtre, rassurez-vous, la mienne. Parce que je me suis rendu compte, il y a quelques semaines, que j'étais devenu incapable de lire un article en entier sans consulter mon téléphone. Et la vraie question, celle qui m'a tenu éveillé, ce n'est pas « comment font les autres », c'est : à quel moment, exactement, est-ce que j'ai arrêté d'être capable de m'ennuyer ?

    Alors on va essayer d'y répondre ensemble, tranquillement, en trois parties. C'est parti.

# ---------------------------------------------------------------------
lf06:
  titre: "Podcast dialogue — transcription deux intervenants"
  genre: podcast_dialogue
  duree_cible_s: 62
  fictif: true
  traits: [ponctuation_dialogue, disfluence, anglicisme, discours_rapporte, question_rhetorique]
  texte: |
    — Donc, si je résume, tu as tout arrêté du jour au lendemain.

    — Pas exactement du jour au lendemain. Disons que ça faisait deux ans que j'y pensais, et qu'un matin, j'ai juste... arrêté d'y penser et commencé à le faire.

    — Et la réaction de ton entourage ?

    — Alors ça, c'est intéressant. Mes proches, en fait, ont été beaucoup plus inquiets que moi. Ma mère m'a appelé pour me demander si tout allait bien. Un ami m'a dit, mot pour mot : « Tu es sûr que ce n'est pas une fuite ? »

    — Et c'en était une ?

    — Peut-être. Mais je crois qu'à un moment, il faut accepter que fuir quelque chose et courir vers autre chose, ça peut être exactement le même geste.

    — Exactement le même geste. On garde ça pour le titre de l'épisode.

