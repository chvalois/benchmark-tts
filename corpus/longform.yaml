# =====================================================================
# Corpus LONG-FORM (v2) — FIXE et PARTAGÉ par tous les modèles.
# Volet « narration longue + podcast + journalisme » : tenue du timbre
# sur plusieurs minutes, respiration inter-paragraphes, prosodie de
# registre (lecture littéraire vs animateur radio vs desk info).
#
# ⚠️ Distinct de `corpus/phrases.yaml` (v1). Même règle : ne jamais
# modifier une entrée en cours de release — rejouer tout le volet sinon.
#
# ⚠️ Tous les textes sont ORIGINAUX et FICTIFS (`fictif: true`). Les
# extraits qui imitent une dépêche ou une brève emploient des organismes,
# lieux et personnes INVENTÉS (univers Grismouton / Kernide / Vallée de
# Mérindol) : ce sont des stimuli de test, jamais du journalisme réel.
# Les sigles réels (INSEE, BCE, CAC 40…) servent uniquement de test de
# normalisation ; les faits chiffrés associés sont inventés.
#
# Schéma d'une entrée :
#   <id>:
#     titre:          str   — titre de travail (non lu ; repère humain)
#     genre:          narration_livre | podcast_solo | podcast_dialogue
#                     | interview_reponse | journalisme_flash
#                     | journalisme_reportage | edito | documentaire
#                     | vulgarisation
#     duree_cible_s:  int   — durée approximative attendue (repère de dérive)
#     fictif:         bool  — true = contenu inventé (toujours true ici)
#     traits:         liste parmi :
#                     tenue_timbre | respiration_paragraphe | sigle
#                     | date_heure | nombre_complexe | nom_propre_dense
#                     | discours_rapporte | enumeration | question_rhetorique
#                     | incise | anglicisme | disfluence
#                     | ponctuation_dialogue | ironie | terminologie
#                     | bascule_registre
#     texte:          str (bloc `|`) — texte source AVANT pré-traitement §3.9
#
# lf01–lf04 : narration livre audio (littéraire)
# lf05–lf08 : podcast (solo, dialogue, interview, vulgarisation)
# lf09–lf12 : journalisme (flash, reportage, édito, TN hostile)
# =====================================================================

