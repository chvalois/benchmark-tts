lf07:
  titre: "Interview — réponse longue d'un invité, registre spontané"
  genre: interview_reponse
  duree_cible_s: 68
  fictif: true
  traits: [disfluence, incise, discours_rapporte, nombre_complexe, bascule_registre]
  texte: |
    Alors, comment est-ce que c'est né... En fait, au départ, il n'y avait pas de projet, hein. Il faut être honnête. On était trois, dans un garage prêté par le père de Samuel, à Mérindol, et on bricolait des trucs le week-end sans se poser de questions.

    Ce qui a tout changé, c'est une commande. Enfin, je dis « commande », c'était une dame du village qui nous a demandé si on pouvait lui réparer une horloge. Une horloge comtoise, très ancienne, qui appartenait à sa grand-mère. Et là, du coup, on a passé, je crois, six week-ends dessus. Six. Pour une seule horloge.

    Et à la fin, quand on la lui a rapportée et qu'elle s'est mise à pleurer en entendant le carillon, on s'est regardés tous les trois et on a compris, en même temps, qu'on ne réparait pas des objets. On réparait, comment dire... du temps. Du temps que les gens croyaient avoir perdu.

