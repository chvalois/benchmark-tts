lf09:
  titre: "Flash info — brèves, desk, registre soutenu"
  genre: journalisme_flash
  duree_cible_s: 78
  fictif: true
  traits: [sigle, date_heure, nombre_complexe, nom_propre_dense, discours_rapporte, enumeration]
  texte: |
    Il est dix-huit heures, voici les titres de ce mardi 3 juin.

    Climat. L'Institut Mérindol de climatologie publie ce matin son rapport annuel : la vallée a connu, l'an dernier, quarante-trois jours de fortes chaleurs, contre vingt-huit en moyenne sur la décennie précédente. Selon sa directrice, Aline Vaugirard, « le seuil d'alerte, fixé à trente jours, est désormais dépassé une année sur deux ».

    Transports. La liaison ferroviaire entre Kernide et Sainte-Ambroise sera interrompue du 12 au 26 juillet, pour des travaux de modernisation évalués à quatre-vingt-douze millions d'euros. Un service de bus de remplacement est prévu.

    Économie. Le taux de chômage dans le département recule de zéro virgule quatre point au deuxième trimestre, pour s'établir à six virgule un pour cent, son plus bas niveau depuis deux mille huit.

    Sport, culture et météo dans un instant, restez avec nous.

