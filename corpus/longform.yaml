lf08:
  titre: "Vulgarisation — épisode de science, analogie et chiffres"
  genre: vulgarisation
  duree_cible_s: 78
  fictif: true
  traits: [terminologie, sigle, nombre_complexe, question_rhetorique, enumeration, anglicisme]
  texte: |
    Imaginez que vous vouliez recopier, à la main, un livre de trois milliards de lettres, sans faire plus d'une faute toutes les dix mille pages. Impossible ? C'est pourtant, à peu près, ce que fait chacune de vos cellules chaque fois qu'elle se divise. Ce livre, c'est votre ADN, et la machinerie qui le recopie est d'une précision qui dépasse tout ce que nous savons fabriquer.

    Comment ça marche ? En très simplifié, trois étapes. D'abord, la double hélice s'ouvre, comme une fermeture éclair. Ensuite, une enzyme, l'ADN polymérase, avance le long de chaque brin et place, en face de chaque lettre, sa lettre complémentaire. Enfin, un système de relecture repasse derrière et corrige les erreurs, une par une.

    Le taux d'erreur final est de l'ordre d'une lettre fausse sur un milliard. À titre de comparaison, un modèle d'IA entraîné pour la même tâche ferait, aujourd'hui, nettement moins bien. La nature, sur ce coup-là, garde une confortable avance.

