# NARRATION — LIVRE AUDIO
# ---------------------------------------------------------------------
lf01:
  titre: "Le moulin de Grismouton — ouverture de chapitre"
  genre: narration_livre
  duree_cible_s: 115
  fictif: true
  traits: [tenue_timbre, respiration_paragraphe, discours_rapporte, incise, homographe_heterophone]
  texte: |
    La route qui descend vers Grismouton n'a jamais figuré sur aucune carte sérieuse. Elle s'enfonce entre deux haies d'aubépine, tourne trois fois sur elle-même sans raison apparente, puis débouche, presque à regret, sur une vallée que les nuages semblent avoir choisie pour y dormir. C'est là, tout au fond, près d'un ruisseau qui ne gèle jamais tout à fait, que se dresse le vieux moulin.

    Personne, dans le village, ne l'appelait autrement que « le moulin ». Il n'avait pas besoin d'un autre nom. Les anciens racontaient qu'un hiver, il y a de cela quatre-vingt-onze ans, le meunier y avait enfermé le vent lui-même, un soir de tempête, pour l'empêcher d'emporter la toiture. Depuis, disaient-ils en baissant la voix, le vent dormait dans la grande roue de bois, et il ne fallait surtout pas le réveiller.

    Camille, elle, n'avait jamais cru à ces histoires. Elle avait douze ans, un cartable trop lourd, et une manière bien à elle de hausser les épaules quand on lui parlait de fantômes. « Ce sont des contes pour faire tenir les enfants tranquilles », répétait-elle, ce qui était exactement le genre de phrase qu'un adulte aurait pu dire à sa place.

    Ce matin-là, pourtant, elle descendit le sentier gelé bien avant le jour, une lanterne à la main, sans très bien savoir ce qu'elle espérait trouver. La porte du moulin n'était pas fermée à clé. À l'intérieur, l'air sentait la farine froide et le bois humide. La grande roue attendait, immobile ; et lorsque la fillette y posa la paume, le bois, sous ses doigts, était tiède.

# ---------------------------------------------------------------------
lf02:
  titre: "La bibliothèque de nuit — passage descriptif et dialogue"
  genre: narration_livre
  duree_cible_s: 85
  fictif: true
  traits: [tenue_timbre, ponctuation_dialogue, discours_rapporte, enumeration, incise]
  texte: |
    À minuit passé, la bibliothèque municipale de Kernide changeait de nature. Les lampes de lecture s'éteignaient une à une, les radiateurs se taisaient, et il ne restait bientôt qu'une seule fenêtre allumée, tout en haut, sous les combles : celle du bureau de monsieur Aldwin, le bibliothécaire de nuit.

    Il occupait ce poste depuis dix-neuf ans. Sa tâche officielle tenait en trois lignes : vérifier les serrures, relever la température des réserves, et consigner dans un cahier chaque livre rendu après la fermeture. Sa tâche réelle, celle dont il ne parlait à personne, consistait à écouter.

    — Vous entendez ça ? me demanda-t-il, le soir où il accepta enfin de me laisser monter.

    Je tendis l'oreille. Le bâtiment craquait, comme tous les vieux bâtiments. Une gouttière, quelque part, comptait les secondes.

    — C'est le papier, dit-il, sans se retourner. Des kilomètres de papier qui respirent. Le jour, on ne l'entend pas, il y a trop de bruit. Mais la nuit, si vous restez tranquille, vous finissez par distinguer chaque rayon, chaque étagère, chaque reliure. Et il y en a une, au fond de la salle des archives, qui ne respire pas du tout.

# ---------------------------------------------------------------------
lf03:
  titre: "Traversée en mer — récit à la première personne, tension"
  genre: narration_livre
  duree_cible_s: 70
  fictif: true
  traits: [tenue_timbre, respiration_paragraphe, nombre_complexe, question_rhetorique]
  texte: |
    Nous avions quitté le port de Sainte-Ambroise à cinq heures du matin, avec vingt litres d'eau douce, trois jours de vivres et une confiance que je jugerais aujourd'hui déraisonnable. Le baromètre était stable. La météo annonçait un vent de force quatre, virant nord-ouest dans l'après-midi. Rien, absolument rien, ne laissait présager ce qui allait suivre.

    Vers treize heures, la mer a changé de couleur. Ce n'est pas une image : elle est passée d'un gris-vert ordinaire à quelque chose de plus sombre, de plus lourd, comme si l'eau elle-même s'était épaissie. Mon frère, à la barre, n'a rien dit. Il a seulement resserré la sangle de son gilet, et j'ai compris que nous pensions la même chose.

    Combien de temps peut tenir un bateau de neuf mètres dans une houle de six ? Je l'ignorais alors. Je sais seulement que, la première vague nous ayant couché sur le flanc, j'ai cessé de compter les suivantes.

# ---------------------------------------------------------------------
lf04:
  titre: "Le dernier train — nouvelle, chute"
  genre: narration_livre
  duree_cible_s: 63
  fictif: true
  traits: [tenue_timbre, incise, discours_rapporte, date_heure]
  texte: |
    Le dernier train pour Mérindol partait à vingt-trois heures douze, quai numéro quatre, et Hélène le prenait chaque vendredi depuis onze ans. Elle connaissait par cœur la voix du haut-parleur, le grincement du troisième wagon, l'odeur de café refroidi qui stagnait près des portes.

    Ce vendredi-là, le train était vide. Non pas peu rempli : vide. Elle parcourut les six voitures, une à une, sans croiser un seul voyageur, pas même un contrôleur. Les banquettes étaient tièdes, comme si les gens venaient tout juste de se lever.

    À l'approche de Mérindol, le haut-parleur grésilla, puis une voix qu'elle ne reconnut pas annonça, très calmement : « Nous vous rappelons que ce train ne dessert plus aucune gare. Merci de votre fidélité. » Hélène regarda par la vitre. Dehors, il n'y avait plus de quai. Il n'y avait plus rien du tout.

