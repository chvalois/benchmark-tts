# --- C9 : texte long (dérive de durée, tenue du timbre) -----------------
p26:
  texte: |
    Il y avait, au bout de la vallée de Grismouton, un moulin que personne n'osait plus faire tourner. Les anciens racontaient qu'un hiver, il y a de cela quatre-vingt-onze ans, le meunier Aristide Vaillant-Coste y avait enfermé le vent lui-même, un soir de tempête, pour l'empêcher d'emporter la toiture. Depuis, disait-on, le vent dormait dans la roue, et il ne fallait surtout pas le réveiller.

    Camille n'avait jamais cru à ces histoires. À douze ans, elle trouvait que les grandes personnes inventaient des dangers pour éviter d'avoir à expliquer les vraies choses. Ce matin-là, elle descendit le sentier gelé avant le lever du jour, une lanterne à la main, bien décidée à voir de ses yeux ce qu'il y avait derrière la porte du moulin. Le givre craquait sous ses pas comme du sucre. Au loin, l'horloge du village sonna six coups, puis un septième, plus grave, qui resta longtemps suspendu dans l'air.

    La porte n'était pas fermée à clé. Elle poussa, et le bois gémit sur ses gonds. À l'intérieur, tout était couvert d'une fine poussière blanche, la farine d'un autre siècle, et au centre de la salle, la grande roue de bois attendait, immobile. Camille s'approcha. Elle posa la paume sur l'un des rayons. Le bois était tiède. Tiède, en plein mois de janvier, dans un bâtiment sans feu depuis des décennies.

    — Il y a quelqu'un ? demanda-t-elle, et sa voix lui parut minuscule.

    Rien ne répondit, sinon un souffle, très bas, qui semblait venir de la roue elle-même. Un souffle régulier, patient, comme celui d'un dormeur. Camille retira sa main. Elle comprit alors que l'histoire du meunier n'était peut-être pas une invention, mais une consigne : on n'avait pas voulu lui faire peur, on avait voulu la protéger, et elle, comme toujours, avait pris la protection pour un mensonge.

    Elle aurait pu partir. Elle aurait dû. Au lieu de cela, elle s'assit sur le rebord de pierre, éteignit sa lanterne pour économiser l'huile, et attendit dans le noir que le jour se lève, en écoutant respirer le vent. Elle se disait que si on l'avait enfermé si longtemps, quelqu'un, un jour, devrait bien lui ouvrir la porte, et lui demander pardon, et le laisser repartir vers les collines. Elle se disait aussi que ce quelqu'un, ce serait peut-être elle. Le souffle, dans la roue, sembla ralentir, puis s'apaiser, comme s'il avait, lui aussi, décidé d'attendre encore un peu.

    Quand la première lumière grise passa sous la porte, Camille rouvrit les yeux. Elle n'avait pas dormi, ou à peine. Le moulin lui paraissait plus petit qu'à son arrivée, presque ordinaire, et pourtant quelque chose avait changé. Sur le sol, dans la farine, on voyait la trace nette de ses pas jusqu'au centre de la salle, et autour de la roue, un large cercle balayé, net, comme si un courant d'air très doux avait tourné là toute la nuit. Elle se leva, ralluma sa lanterne, et remonta le sentier sans se retourner. Au village, elle ne raconta rien à personne. Mais chaque matin, désormais, elle descendait jusqu'au moulin, posait la main sur le bois tiède, disait bonjour à voix basse, et repartait. Et les anciens, qui la regardaient passer depuis leurs fenêtres, hochaient la tête en silence, parce qu'ils savaient, eux, qu'une porte gardée pendant quatre-vingt-onze ans finit toujours, un jour, par trouver la main qui l'ouvrira.
  longueur: long
  registre: narration
  pieges: [nombre, nom_propre, liaison, silence_rythme]
  type: long_form

