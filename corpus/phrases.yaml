# =====================================================================
# Corpus de test FR — FIXE et PARTAGÉ par tous les modèles.
# Ne jamais modifier une entrée existante en cours de release :
# rejouer l'intégralité du benchmark sinon (cf. protocole §4.5).
#
# Schéma d'une entrée :
#   <id>:
#     texte:     str   — texte source (AVANT pré-traitement §3.9)
#     longueur:  court | moyen | long
#     registre:  narration | dialogue_joie | dialogue_colere
#                | dialogue_peur | dialogue_tristesse | cours_magistral
#     pieges:    liste parmi :
#                liaison | nombre | nom_propre | silence_rythme
#                | homographe_heterophone | emprunt_en
#                | ponctuation_repetee | onomatopee
#     type:      (optionnel, défaut "phrase")
#                phrase | titre | long_form | multi_voix
#
# p01–p20  : grille longueur × registre × piège (doc REFLEXIONCLAUDE)
# p21–p34  : capacités C4/C8/C9/C10/C11 + cas limites du pré-traitement
#            (doc APIAVISOL)
# =====================================================================

