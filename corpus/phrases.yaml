# --- C9 : texte long (dérive de durée, tenue du timbre) -----------------
p26:
  texte: |
    Il y avait, au bout de la vallée de Grismouton, un moulin que personne n'osait plus faire tourner. Les anciens racontaient qu'un hiver, il y a de cela quatre-vingt-onze ans, le meunier Aristide Vaillant-Coste y avait enfermé le vent lui-même, un soir de tempête, pour l'empêcher d'emporter la toiture. Depuis, disait-on, le vent dormait dans la roue, et il ne fallait surtout pas le réveiller.

    Camille n'avait jamais cru à ces histoires. Ce matin-là, elle descendit le sentier gelé avant le jour, une lanterne à la main. La porte n'était pas fermée à clé. À l'intérieur, la grande roue de bois attendait, immobile, et le bois, sous sa paume, était tiède.

    — Il y a quelqu'un ? demanda-t-elle, et sa voix lui parut minuscule.

    Rien ne répondit, sinon un souffle très bas, régulier, patient, qui semblait venir de la roue elle-même.
  longueur: long
  registre: narration
  pieges: [nombre, nom_propre, liaison, silence_rythme]
  type: long_form

